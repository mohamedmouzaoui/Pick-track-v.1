<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick & Track Agents</title>
<style>
  :root {
    --navy:#0f2a4a; --blue:#1f6fb2; --bg:#f3f5f7; --card:#fff; --line:#d9dee3;
    --txt:#1c2733; --mut:#5f6b78;
    --low:#2e7d32; --med:#b26a00; --high:#c62828;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }

  header { background:var(--navy); color:#fff; }
  .top { max-width:1160px; margin:0 auto; padding:14px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:18px; }
  .top h1 { font-size:19px; font-weight:600; margin:0 auto 0 0; }
  .top .info { font-size:13px; color:#b9c7d8; }
  .top .info b { color:#fff; font-weight:600; }

  .bar { background:var(--card); border-bottom:1px solid var(--line); }
  .bar-in { max-width:1160px; margin:0 auto; padding:10px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .bar-in label { font-size:13px; color:var(--mut); }
  select,button { font:inherit; font-size:14px; color:var(--txt); background:#fff; border:1px solid #b9c2cb; border-radius:4px; padding:6px 12px; }
  button { cursor:pointer; }
  button:hover { background:#eef2f6; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; padding:6px 22px; }
  button.primary:hover { background:#195d96; }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  main { max-width:1160px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:16px; padding:16px 20px 40px; align-items:start; }
  main > section > .panel + .panel { margin-top:16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:14px 16px; }
  .panel h2 { font-size:15px; font-weight:600; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  canvas { width:100%; height:auto; background:#fafbfc; border:1px solid var(--line); display:block; }

  .track { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .track b { min-width:30px; }
  .meter { flex:1; height:8px; background:#e6eaee; border-radius:2px; overflow:hidden; }
  .meter i { display:block; height:100%; }
  .lvl-LOW { color:var(--low); } .lvl-MEDIUM { color:var(--med); } .lvl-HIGH { color:var(--high); }
  .track span { min-width:84px; text-align:right; font-weight:600; font-size:13px; }

  .feed { max-height:230px; overflow:auto; font-size:13px; }
  .feed div { padding:4px 0; border-bottom:1px solid #edf0f3; }
  .feed .t { color:var(--mut); display:inline-block; min-width:52px; }

  .case { border:1px solid var(--line); border-radius:4px; padding:12px; margin-bottom:12px; }
  .case:last-child { margin-bottom:0; }
  .case h3 { margin:0 0 8px; font-size:15px; font-weight:600; }
  .agent { margin:8px 0; padding-left:10px; border-left:3px solid #c3ccd5; }
  .agent b.name { color:var(--blue); }
  .tag { font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:3px; padding:0 5px; margin-left:6px; }
  .mut { color:var(--mut); font-weight:400; }
  ul { margin:4px 0 0 18px; padding:0; }
  .empty { color:var(--mut); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Pick &amp; Track Agents</h1>
    <span class="info" id="llm">LLM: …</span>
    <span class="info">Status: <b id="status">idle</b></span>
  </div>
</header>
<div class="bar">
  <div class="bar-in">
    <label for="scenario">Scenario</label>
    <select id="scenario">
      <option value="mixed">mixed (3 people)</option>
      <option value="honest">honest shopper</option>
      <option value="shoplifter">shoplifter</option>
      <option value="browser">browser (no pick)</option>
    </select>
    <label for="speed">Speed</label>
    <select id="speed">
      <option value="4">slow</option><option value="8" selected>normal</option><option value="30">fast</option>
    </select>
    <button class="primary" id="run">Run</button>
    <button id="reset">Reset</button>
  </div>
</div>
<main>
  <section>
    <div class="panel"><h2>Store view <span class="mut" id="clock"></span></h2><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="panel"><h2>Tracks &amp; risk</h2><div id="tracks" class="empty">No one yet. Press Run.</div></div>
    <div class="panel"><h2>Detector events</h2><div id="events" class="feed empty">Waiting…</div></div>
  </section>
  <section>
    <div class="panel"><h2>Agent cases</h2><div id="cases" class="empty">Cases appear when a person's risk gets high or they leave after picking items.</div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL = {LOW:'#2e7d32', MEDIUM:'#b26a00', HIGH:'#c62828'};
const ZCOL = {shelf:'#1f6fb2', checkout:'#6a4fa3', exit:'#c25e00'};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { alert((await r.json()).detail || 'error'); throw new Error(r.status); }
  return r.json();
}

function drawCanvas(s) {
  const cv = $('#cv'), g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.font = '22px -apple-system,"Segoe UI",Helvetica,sans-serif'; g.lineWidth = 2;
  for (const z of s.zones.zones) {
    const [x1, y1, x2, y2] = z.rect, c = ZCOL[z.kind] || '#888';
    g.fillStyle = c + '12'; g.strokeStyle = c; g.fillRect(x1, y1, x2 - x1, y2 - y1); g.strokeRect(x1, y1, x2 - x1, y2 - y1);
    g.fillStyle = c; g.fillText(z.name, x1 + 8, y1 + 26);
  }
  for (const p of s.persons) {
    const [x1, y1, x2, y2] = p.bbox, c = COL[p.level] || COL.LOW;
    g.strokeStyle = c; g.lineWidth = 3; g.strokeRect(x1, y1, x2 - x1, y2 - y1);
    g.fillStyle = c; g.fillText('#' + p.id + ' ' + p.level, x1, y1 - 8);
    for (const w of p.wrists) { g.beginPath(); g.arc(w[0], w[1], 7, 0, 6.3); g.fill(); }
  }
}

function render(s) {
  $('#llm').textContent = 'LLM: ' + s.llm_provider + (s.llm_provider === 'offline' ? ' (rules only)' : '');
  $('#status').textContent = s.status;
  $('#clock').textContent = s.status === 'idle' ? '' : '· t = ' + s.t + 's';
  $('#run').disabled = s.status === 'running';
  drawCanvas(s);

  const ids = Object.keys(s.risks);
  $('#tracks').className = ids.length ? '' : 'empty';
  $('#tracks').innerHTML = ids.length ? ids.map(id => {
    const r = s.risks[id];
    return `<div class="track"><b>#${esc(id)}</b><div class="meter"><i style="width:${r.score}%;background:${COL[r.level]}"></i></div>
            <span class="lvl-${esc(r.level)}">${esc(r.level)} ${r.score}</span></div>`;
  }).join('') : 'No one yet. Press Run.';

  $('#events').className = 'feed' + (s.events.length ? '' : ' empty');
  $('#events').innerHTML = s.events.length ? s.events.slice().reverse().map(e =>
    `<div><span class="t">${e.t.toFixed(1)}s</span> #${e.track_id} <b>${esc(e.kind)}</b> ${esc(e.zone || '')}</div>`).join('') : 'Waiting…';

  $('#cases').className = s.cases.length ? '' : 'empty';
  $('#cases').innerHTML = s.cases.length ? s.cases.map(c => {
    const tag = a => `<span class="tag">${esc(a.source)}</span>`;
    return `<div class="case">
      <h3>Case ${c.case_id} · person #${c.track_id} · <span class="lvl-${esc(c.risk.level)}">${esc(c.risk.level)} ${c.risk.score}/100</span>
          <span class="mut"> · trigger: ${esc(c.trigger)}</span></h3>
      <div class="agent"><b class="name">Observer</b>${tag(c.observer)}<br>${esc(c.observer.narrative)}</div>
      <div class="agent"><b class="name">Analyst</b>${tag(c.analyst)}<br>Verdict: <b>${esc(c.analyst.verdict)}</b> (${c.analyst.confidence})<br><span class="mut">${esc(c.analyst.reasoning)}</span></div>
      <div class="agent"><b class="name">Skeptic</b>${tag(c.skeptic)}<br>Chance it is innocent: <b>${Math.round(c.skeptic.doubt * 100)}%</b>
          <ul>${c.skeptic.alternatives.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="agent"><b class="name">Responder</b>${tag(c.responder)}<br>Action: <b>${esc(c.responder.action)}</b>
          ${c.responder.requires_human_review ? '· human review required' : ''}<br>${esc(c.responder.message)}</div>
    </div>`;
  }).join('') : 'Cases appear when a person\'s risk gets high or they leave after picking items.';
}

async function tick() { try { render(await api('/api/state')); } catch (e) {} }
$('#run').onclick = async () => { await api(`/api/run?scenario=${$('#scenario').value}&speed=${$('#speed').value}`, {method:'POST'}); tick(); };
$('#reset').onclick = async () => { await api('/api/reset', {method:'POST'}); tick(); };
tick(); setInterval(tick, 500);
</script>
</body>
</html>
